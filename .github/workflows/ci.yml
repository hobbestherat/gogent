name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # The production target is aarch64 (Raspberry Pi), where the race detector is
  # unavailable. The detector's findings are architecture-independent, so we run
  # the module under -race on an x86 runner to catch data races regardless.
  test:
    name: build & test (-race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test (race)
        run: go test ./... -race -count=1

  vulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    # Enforced: the initial findings have been triaged and the tree is clean, so
    # lint now blocks on regressions like the other jobs (was advisory while the
    # opinionated gosec/wrapcheck set was first brought up over the codebase).
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      # The repo's .golangci.yml is a v2 config, so the action must install
      # golangci-lint v2. Action v9 does (it dropped v1 support entirely) and runs
      # on node24, clearing the node20 runner deprecation that v8 still carried.
      # Pin the linter version (rather than "latest") so the now-enforcing job is
      # reproducible: a new golangci-lint release can add checks that would fail an
      # unrelated PR. Bump this deliberately.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
